<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>Temperatura e Umidade MQTT</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>

    <h1>Monitoramento MQTT</h1>

    <p>Projeto da Ana, Rafael e Bel</p>


    <!-- STATUS DO BROKER -->
    <div id="statusBroker" class="status-broker conectando">

        <span class="bolinha-status"></span>

        <span id="textoStatus">
            Conectando ao broker...
        </span>

    </div>


    <div class="container">


        <!-- TEMPERATURA -->

        <div class="card sensor-card">

            <h2>Temperatura</h2>

            <div class="valor">

                <span id="temperatura">--</span> °C

            </div>

        </div>


        <!-- UMIDADE -->

        <div class="card sensor-card">

            <h2>Umidade</h2>

            <div class="valor">

                <span id="umidade">--</span> %

            </div>

        </div>


        <!-- LED 1 -->

        <div class="card led-card">

            <h2>LED 1</h2>

            <button id="botaoLed1" onclick="controlarLed1()">

                Ligar LED 1

            </button>

        </div>


        <!-- LED 2 -->

        <div class="card led-card">

            <h2>LED 2</h2>

            <button id="botaoLed2" onclick="controlarLed2()">

                Ligar LED 2

            </button>

        </div>


    </div>


    <!-- BIBLIOTECA MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


    <!-- SEU JAVASCRIPT -->
    <script src="./script.js"></script>


</body>

</html>
